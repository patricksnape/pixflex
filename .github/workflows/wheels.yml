name: Wheels

# Builds the sdist + wheel on every PR, manual run and version tag. Publishing uses PyPI trusted
# publishing (OIDC, no tokens) and uploads PEP 740 attestations automatically.
#   * push a tag `vX.Y.Z` (must equal the version in pyproject.toml) -> PyPI
#   * manual run with `publish: testpypi`                              -> TestPyPI
on:
  pull_request:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publish:
        description: "Where to publish the built files"
        type: choice
        options: [none, testpypi]
        default: none

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv build
      - run: pipx run twine check --strict dist/*
      - name: Smoke-test the wheel in a clean environment
        run: |
          uv venv --python 3.12 /tmp/smoke
          uv pip install --python /tmp/smoke dist/*.whl numpy pillow  # pillow: resizer for the contain fit
          cd /tmp && /tmp/smoke/bin/python - <<'PY'
          import numpy as np
          from pixflex import Column, Row, Slot

          with Column(width=40, height=20, background=0) as root:
              with Row(flex=1, gap=2):
                  a = Slot(flex=1)
                  b = Slot(flex=1, fit="contain")
          img = root.solve().compose({a: np.full((5, 5, 3), 200, np.uint8), b: np.full((5, 5, 3), 90, np.uint8)}, like=np.zeros((1, 1, 3), np.uint8))
          assert img.shape == (20, 40, 3) and img.max() == 200, img.shape
          print("ok", img.shape)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*

  publish-pypi:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - name: Tag must match the package version
        run: |
          version=$(python3 -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          test "v$version" = "${GITHUB_REF_NAME}" || { echo "tag ${GITHUB_REF_NAME} != version v$version"; exit 1; }
      - uses: actions/download-artifact@v4
        with: { name: dist, path: dist }
      - uses: pypa/gh-action-pypi-publish@release/v1

  publish-testpypi:
    if: github.event_name == 'workflow_dispatch' && inputs.publish == 'testpypi'
    needs: build
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with: { name: dist, path: dist }
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
